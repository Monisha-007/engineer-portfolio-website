  <line x1="320" y1="142" x2="360" y2="142" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <line x1="440" y1="142" x2="480" y2="142" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <line x1="560" y1="142" x2="600" y2="142" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
