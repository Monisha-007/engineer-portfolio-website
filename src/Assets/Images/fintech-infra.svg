  <rect x="435" y="220" width="90" height="40" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1" opacity="0.7"/>
  <text x="480" y="245" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="9">TradeIndia</text>
  <rect x="540" y="220" width="70" height="40" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1" opacity="0.7"/>
  <text x="575" y="245" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="9">Canfin</text>
