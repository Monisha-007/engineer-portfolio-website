  <text x="250" y="313" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10">GuardDuty</text>
  <rect x="340" y="290" width="120" height="35" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  <text x="400" y="313" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10">Secrets Manager</text>
  <rect x="500" y="290" width="100" height="35" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  <text x="550" y="313" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10">CloudWatch</text>
  <text x="400" y="405" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="16" opacity="0.8">Fintech AWS Infrastructure</text>
  <text x="400" y="428" text-anchor="middle" fill="#047857" font-family="monospace" font-size="11" opacity="0.6">Security · Compliance · High Availability · Multi-Client</text>
