<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#030d0a"/>
  <defs>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="circuit" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M10 0 L10 10 L0 10" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
      <path d="M50 60 L50 50 L60 50" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
      <circle cx="10" cy="10" r="2" fill="#10b981" opacity="0.2"/>
      <circle cx="50" cy="50" r="2" fill="#10b981" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#circuit)"/>
  <ellipse cx="400" cy="225" rx="280" ry="160" fill="url(#glow3)"/>
  <!-- VPC box -->
  <rect x="80" y="80" width="640" height="280" rx="12" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="110" y="108" fill="#10b981" font-family="monospace" font-size="11" opacity="0.7">AWS VPC</text>
  <!-- WAF -->
  <rect x="120" y="120" width="80" height="45" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="160" y="149" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11">WAF</text>
  <!-- ELB -->
