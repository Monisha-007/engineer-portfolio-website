  <text x="400" y="149" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11">EKS</text>
  <!-- RDS -->
  <rect x="480" y="120" width="80" height="45" rx="6" fill="#052e16" stroke="#34d399" stroke-width="1"/>
  <text x="520" y="149" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11">RDS</text>
  <!-- CloudFront -->
