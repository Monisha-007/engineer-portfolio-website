  <rect x="366" y="100" width="130" height="170" rx="10" fill="#1c0a00" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="431" y="125" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="10" font-weight="bold">AZURE</text>
  <text x="431" y="142" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="10" font-weight="bold">COGNITIVE SEARCH</text>
  <text x="431" y="170" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="9">Vector Index</text>
  <text x="431" y="188" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="9">Semantic Search</text>
  <text x="431" y="206" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="9">Hybrid Retrieval</text>
  <text x="431" y="224" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="9">Chunk Scoring</text>
  <text x="431" y="252" text-anchor="middle" fill="#92400e" font-family="monospace" font-size="8">RAG Knowledge Base</text>

  <!-- Arrow -->
  <line x1="496" y1="185" x2="526" y2="185" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="526,178 541,185 526,192" fill="#f59e0b"/>

  <!-- Azure OpenAI -->
  <rect x="541" y="112" width="120" height="146" rx="10" fill="#1c0a00" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="601" y="136" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">AZURE OPENAI</text>
  <text x="601" y="160" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="9">RAG Augmentation</text>
  <text x="601" y="178" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="9">LLM Response</text>
  <text x="601" y="196" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="9">SSE Streaming</text>
  <text x="601" y="214" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="9">Context Window</text>
  <text x="601" y="242" text-anchor="middle" fill="#92400e" font-family="monospace" font-size="8">GPT-4o</text>

  <!-- Arrow -->
  <line x1="661" y1="185" x2="683" y2="185" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="683,178 698,185 683,192" fill="#f59e0b"/>

  <!-- React Chat UI -->
  <rect x="698" y="100" width="86" height="170" rx="10" fill="#1c0a00" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="741" y="122" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold">CHAT UI</text>
  <!-- Chat bubbles representation -->
  <rect x="708" y="132" width="66" height="18" rx="9" fill="#fbbf24" opacity="0.25"/>
  <text x="741" y="145" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="8">User Query</text>
  <rect x="708" y="158" width="66" height="28" rx="6" fill="#f59e0b" opacity="0.2"/>
  <text x="741" y="172" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="8">AI Response</text>
  <text x="741" y="185" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="8">Streaming</text>
  <text x="741" y="208" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="8">Markdown</text>
  <text x="741" y="224" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="8">Graph View</text>
  <text x="741" y="250" text-anchor="middle" fill="#92400e" font-family="monospace" font-size="8">WebSocket</text>

  <text x="400" y="388" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="15" opacity="0.9">Product-RAG · AI Document Intelligence Platform</text>
  <text x="400" y="416" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="10" opacity="0.7">FastAPI · React 18 · Azure OpenAI · Cognitive Search · Service Bus · Redis · Docker · Heroku</text>
</svg>
