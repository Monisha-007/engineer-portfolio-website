  <rect x="173" y="80" width="148" height="220" rx="10" fill="#1c0a00" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="247" y="106" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">PIPELINE</text>
  <!-- Step boxes -->
  <rect x="188" y="115" width="118" height="30" rx="5" fill="#1c0a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="247" y="135" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">① Service Bus Queue</text>
  <line x1="247" y1="145" x2="247" y2="155" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="188" y="155" width="118" height="30" rx="5" fill="#1c0a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="247" y="175" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">② PDF Chunking</text>
  <line x1="247" y1="185" x2="247" y2="195" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="188" y="195" width="118" height="30" rx="5" fill="#1c0a00" stroke="#f59e0b" stroke-width="1"/>
  <text x="247" y="215" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">③ Redis Cache</text>
  <line x1="247" y1="225" x2="247" y2="235" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="188" y="235" width="118" height="30" rx="5" fill="#1c0a00" stroke="#fbbf24" stroke-width="1"/>
  <text x="247" y="255" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9">④ Vector Embeddings</text>
  <text x="247" y="285" text-anchor="middle" fill="#92400e" font-family="monospace" font-size="8">Container App</text>

  <!-- Arrow -->
  <line x1="321" y1="185" x2="351" y2="185" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="351,178 366,185 351,192" fill="#f59e0b"/>

