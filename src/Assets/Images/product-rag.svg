<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0d0d0d"/>
  <defs>
    <radialGradient id="glow-rag" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#glow-rag)"/>

  <!-- PDF Documents -->
  <rect x="20" y="110" width="110" height="150" rx="8" fill="#1c0a00" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="75" y="136" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">PDF DOCS</text>
  <rect x="35" y="148" width="80" height="8" rx="2" fill="#f59e0b" opacity="0.35"/>
  <rect x="35" y="163" width="65" height="8" rx="2" fill="#f59e0b" opacity="0.28"/>
  <rect x="35" y="178" width="75" height="8" rx="2" fill="#f59e0b" opacity="0.35"/>
  <rect x="35" y="193" width="50" height="8" rx="2" fill="#f59e0b" opacity="0.22"/>
  <rect x="35" y="208" width="70" height="8" rx="2" fill="#f59e0b" opacity="0.28"/>
  <rect x="35" y="223" width="55" height="8" rx="2" fill="#f59e0b" opacity="0.20"/>
  <text x="75" y="248" text-anchor="middle" fill="#92400e" font-family="monospace" font-size="9">Upload</text>

  <!-- Arrow -->
  <line x1="130" y1="185" x2="158" y2="185" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="158,178 173,185 158,192" fill="#f59e0b"/>

