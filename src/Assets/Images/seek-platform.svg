  <text x="400" y="148" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Scrape / Crawl</text>
  <text x="400" y="165" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Blob Storage</text>
  <text x="400" y="182" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">LLM Summary</text>
