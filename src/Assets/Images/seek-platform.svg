  <text x="572" y="152" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="9">Vector Index</text>
  <text x="572" y="173" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Azure OpenAI</text>
  <text x="572" y="190" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">RAG Pipeline</text>
  <text x="572" y="208" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Redis Pub/Sub</text>
  <text x="572" y="226" text-anchor="middle" fill="#164e63" font-family="monospace" font-size="8">GPT-4o · Streaming</text>

