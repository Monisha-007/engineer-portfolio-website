  <rect x="672" y="100" width="112" height="140" rx="10" fill="#082f49" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="728" y="124" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="10" font-weight="bold">REACT UI</text>
  <text x="728" y="146" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Real-time Chat</text>
  <text x="728" y="163" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">WebSocket</text>
  <text x="728" y="180" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Voice Input</text>
  <text x="728" y="197" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Knowledge Base</text>
  <text x="728" y="214" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Admin Dashboard</text>

  <!-- FastAPI backbone bar -->
  <rect x="177" y="295" width="507" height="38" rx="8" fill="#082f49" stroke="#06b6d4" stroke-width="1" opacity="0.75"/>
  <text x="430" y="319" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="11">FastAPI · JWT Auth · MongoDB · WebSockets · 6 Submodules</text>

  <!-- Dashed verticals -->
  <line x1="236" y1="268" x2="236" y2="295" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="400" y1="278" x2="400" y2="295" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="572" y1="285" x2="572" y2="295" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="700" y1="278" x2="700" y2="295" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <text x="400" y="385" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="15" opacity="0.9">SEEK · AI-Powered Web Intelligence Platform</text>
  <text x="400" y="412" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="10" opacity="0.7">FastAPI · React 18 · Azure OpenAI · Cognitive Search · Service Bus · MongoDB · Redis · WebSockets</text>
