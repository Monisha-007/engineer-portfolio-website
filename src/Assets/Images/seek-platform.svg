  </defs>
  <rect width="800" height="450" fill="url(#glow-seek)"/>

  <!-- Stage 1: Social Sources -->
  <rect x="18" y="90" width="118" height="160" rx="10" fill="#082f49" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="77" y="115" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="bold">SOURCES</text>
  <text x="77" y="138" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">LinkedIn</text>
  <text x="77" y="156" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">Twitter / X</text>
  <text x="77" y="174" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">Instagram</text>
  <text x="77" y="192" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">Web Crawl</text>
  <text x="77" y="213" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Playwright</text>
  <text x="77" y="228" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Stealth Mode</text>

  <!-- Arrow -->
  <line x1="136" y1="170" x2="162" y2="170" stroke="#06b6d4" stroke-width="2"/>
