  <text x="236" y="146" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10" font-weight="bold">AZURE</text>
  <text x="236" y="162" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10" font-weight="bold">SERVICE BUS</text>
  <text x="236" y="185" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Async Queue</text>
  <text x="236" y="202" text-anchor="middle" fill="#0891b2" font-family="monospace" font-size="9">Job Dispatch</text>

  <!-- Arrow -->
  <line x1="295" y1="170" x2="321" y2="170" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="321,163 336,170 321,177" fill="#06b6d4"/>

