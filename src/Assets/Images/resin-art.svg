<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0d0d0d"/>
  <defs>
    <radialGradient id="glow-resin" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#glow-resin)"/>

  <!-- Site header bar -->
  <rect x="25" y="42" width="750" height="34" rx="6" fill="#13004d" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="100" y="64" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="bold">ResinCraft</text>
  <rect x="550" y="52" width="70" height="16" rx="4" fill="#7c3aed" opacity="0.6"/>
  <text x="585" y="64" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="8">Products</text>
  <rect x="630" y="52" width="70" height="16" rx="4" fill="#7c3aed" opacity="0.6"/>
  <text x="665" y="64" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="8">About</text>
  <rect x="710" y="52" width="50" height="16" rx="4" fill="#8b5cf6" opacity="0.8"/>
  <text x="735" y="64" text-anchor="middle" fill="white" font-family="monospace" font-size="8">Cart 🛒</text>

  <!-- Product Grid (LEFT) - 2x2 -->
  <!-- Card 1 -->
  <rect x="25" y="88" width="175" height="155" rx="8" fill="#13004d" stroke="#8b5cf6" stroke-width="1.2"/>
  <rect x="35" y="98" width="155" height="90" rx="5" fill="#2e0a7a" opacity="0.8"/>
  <!-- Resin swirl design in card 1 -->
  <ellipse cx="112" cy="143" rx="45" ry="35" fill="#6d28d9" opacity="0.4"/>
  <ellipse cx="112" cy="143" rx="28" ry="22" fill="#7c3aed" opacity="0.5"/>
  <ellipse cx="112" cy="143" rx="14" ry="11" fill="#8b5cf6" opacity="0.7"/>
  <text x="112" y="210" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9">Galaxy Bowl</text>
  <text x="112" y="226" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="10" font-weight="bold">₹ 1,200</text>
  <rect x="65" y="232" width="95" height="4" rx="2" fill="#8b5cf6" opacity="0.4"/>

  <!-- Card 2 -->
  <rect x="210" y="88" width="175" height="155" rx="8" fill="#13004d" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="220" y="98" width="155" height="90" rx="5" fill="#2e0a7a" opacity="0.8"/>
  <!-- Different resin pattern -->
  <ellipse cx="297" cy="143" rx="42" ry="32" fill="#4c1d95" opacity="0.6"/>
  <path d="M270 130 Q297 118 324 130 Q310 155 297 160 Q284 155 270 130 Z" fill="#6d28d9" opacity="0.5"/>
  <ellipse cx="297" cy="143" rx="12" ry="10" fill="#a78bfa" opacity="0.6"/>
  <text x="297" y="210" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9">Ocean Coaster Set</text>
  <text x="297" y="226" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="10" font-weight="bold">₹ 850</text>
  <rect x="250" y="232" width="95" height="4" rx="2" fill="#8b5cf6" opacity="0.4"/>

  <!-- Card 3 -->
  <rect x="25" y="253" width="175" height="155" rx="8" fill="#13004d" stroke="#8b5cf6" stroke-width="1.2"/>
  <rect x="35" y="263" width="155" height="90" rx="5" fill="#2e0a7a" opacity="0.8"/>
  <ellipse cx="112" cy="308" rx="40" ry="30" fill="#7c3aed" opacity="0.3"/>
  <path d="M88 295 L136 295 L136 320 L88 320 Z" fill="#6d28d9" opacity="0.5" rx="4"/>
  <ellipse cx="112" cy="308" rx="18" ry="14" fill="#8b5cf6" opacity="0.5"/>
  <text x="112" y="375" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9">Marble Keychain</text>
  <text x="112" y="391" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="10" font-weight="bold">₹ 450</text>
  <rect x="65" y="397" width="95" height="4" rx="2" fill="#8b5cf6" opacity="0.4"/>

  <!-- Card 4 -->
  <rect x="210" y="253" width="175" height="155" rx="8" fill="#13004d" stroke="#7c3aed" stroke-width="1.2"/>
  <rect x="220" y="263" width="155" height="90" rx="5" fill="#2e0a7a" opacity="0.8"/>
  <ellipse cx="297" cy="308" rx="44" ry="30" fill="#5b21b6" opacity="0.4"/>
  <path d="M270 295 Q297 282 324 295 L320 328 Q297 335 274 328 Z" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="297" cy="308" r="12" fill="#a78bfa" opacity="0.5"/>
  <text x="297" y="375" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9">Geode Tray</text>
  <text x="297" y="391" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="10" font-weight="bold">₹ 1,800</text>
  <rect x="250" y="397" width="95" height="4" rx="2" fill="#8b5cf6" opacity="0.4"/>

  <!-- DIVIDER -->
  <line x1="405" y1="85" x2="405" y2="420" stroke="#4c1d95" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Product Detail View (RIGHT) -->
  <rect x="418" y="88" width="358" height="160" rx="8" fill="#13004d" stroke="#8b5cf6" stroke-width="1.5"/>
  <!-- Large product image -->
  <rect x="428" y="98" width="130" height="140" rx="6" fill="#2e0a7a"/>
  <ellipse cx="493" cy="168" rx="48" ry="40" fill="#6d28d9" opacity="0.5"/>
  <ellipse cx="493" cy="168" rx="30" ry="24" fill="#7c3aed" opacity="0.6"/>
  <ellipse cx="493" cy="168" rx="14" ry="11" fill="#a78bfa" opacity="0.7"/>
  <!-- Product info -->
  <text x="616" y="118" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="11" font-weight="bold">Galaxy Bowl</text>
  <text x="616" y="138" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="10">Premium Resin Art</text>
  <text x="616" y="158" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="13" font-weight="bold">₹ 1,200</text>
  <!-- Star rating -->
  <text x="586" y="176" fill="#f59e0b" font-family="monospace" font-size="12">★★★★★</text>
  <text x="656" y="176" fill="#a78bfa" font-family="monospace" font-size="9">(24)</text>
  <!-- Customize option -->
  <rect x="567" y="185" width="186" height="18" rx="4" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1" opacity="0.7"/>
  <text x="660" y="198" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="8">Custom: Add name / color</text>
  <!-- Custom image sharing note -->
  <text x="616" y="226" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="8">Share custom preview image</text>

  <!-- WhatsApp Order Integration -->
  <rect x="418" y="260" width="358" height="140" rx="8" fill="#022c22" stroke="#25D366" stroke-width="1.5"/>
  <text x="597" y="285" text-anchor="middle" fill="#25D366" font-family="monospace" font-size="11" font-weight="bold">WhatsApp Order Integration</text>
  <!-- Chat bubble -->
  <rect x="438" y="296" width="210" height="45" rx="8" fill="#055c2e" opacity="0.8"/>
  <text x="543" y="315" text-anchor="middle" fill="#dcfce7" font-family="monospace" font-size="8">Hi! I want to order Galaxy Bowl (₹1200)</text>
  <text x="543" y="330" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="8">With custom name: "Priya" in blue</text>
  <!-- Order button -->
  <rect x="458" y="352" width="280" height="34" rx="17" fill="#25D366" opacity="0.9"/>
  <text x="598" y="374" text-anchor="middle" fill="white" font-family="monospace" font-size="10" font-weight="bold">📱 Order via WhatsApp</text>
  <!-- Small note -->
  <text x="597" y="394" text-anchor="middle" fill="#059669" font-family="monospace" font-size="8">Auto-fills product name, price &amp; details</text>

  <text x="400" y="425" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="13" opacity="0.9">Resin Art E-Commerce · React · Tailwind CSS · WhatsApp API · Mobile-first</text>
</svg>
