<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0a0a1a"/>
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a3a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>
  <ellipse cx="400" cy="225" rx="250" ry="180" fill="url(#glow1)"/>
  <!-- Neural network nodes -->
  <circle cx="200" cy="150" r="8" fill="#6366f1" opacity="0.9"/>
  <circle cx="200" cy="220" r="8" fill="#6366f1" opacity="0.9"/>
  <circle cx="200" cy="290" r="8" fill="#6366f1" opacity="0.9"/>
  <circle cx="320" cy="120" r="10" fill="#818cf8"/>
  <circle cx="320" cy="190" r="10" fill="#818cf8"/>
  <circle cx="320" cy="260" r="10" fill="#818cf8"/>
  <circle cx="320" cy="330" r="10" fill="#818cf8"/>
  <circle cx="440" cy="150" r="10" fill="#a5b4fc"/>
  <circle cx="440" cy="225" r="10" fill="#a5b4fc"/>
  <circle cx="440" cy="300" r="10" fill="#a5b4fc"/>
  <circle cx="560" cy="180" r="10" fill="#818cf8"/>
  <circle cx="560" cy="270" r="10" fill="#818cf8"/>
  <circle cx="620" cy="225" r="14" fill="#6366f1"/>
  <!-- Connections -->
  <g stroke="#6366f1" stroke-width="1" opacity="0.4">
    <line x1="200" y1="150" x2="320" y2="120"/><line x1="200" y1="150" x2="320" y2="190"/>
    <line x1="200" y1="220" x2="320" y2="190"/><line x1="200" y1="220" x2="320" y2="260"/>
    <line x1="200" y1="290" x2="320" y2="260"/><line x1="200" y1="290" x2="320" y2="330"/>
    <line x1="320" y1="120" x2="440" y2="150"/><line x1="320" y1="190" x2="440" y2="150"/>
    <line x1="320" y1="190" x2="440" y2="225"/><line x1="320" y1="260" x2="440" y2="225"/>
    <line x1="320" y1="260" x2="440" y2="300"/><line x1="320" y1="330" x2="440" y2="300"/>
    <line x1="440" y1="150" x2="560" y2="180"/><line x1="440" y1="225" x2="560" y2="180"/>
    <line x1="440" y1="225" x2="560" y2="270"/><line x1="440" y1="300" x2="560" y2="270"/>
    <line x1="560" y1="180" x2="620" y2="225"/><line x1="560" y1="270" x2="620" y2="225"/>
  </g>
  <!-- Labels -->
  <text x="400" y="400" text-anchor="middle" fill="#6366f1" font-family="monospace" font-size="18" opacity="0.8">Project Miximo · AI Migration Agents</text>
  <text x="400" y="425" text-anchor="middle" fill="#4f46e5" font-family="monospace" font-size="12" opacity="0.6">LangChain · LangGraph · AWS Bedrock · Python</text>
</svg>
