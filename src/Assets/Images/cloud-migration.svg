<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#050d1a"/>
  <defs>
    <radialGradient id="glow2" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0ea5e9" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#dots)"/>
  <ellipse cx="400" cy="200" rx="300" ry="150" fill="url(#glow2)"/>
  <!-- AWS Cloud -->
  <rect x="60" y="120" width="200" height="120" rx="16" fill="#0c1f35" stroke="#0ea5e9" stroke-width="1.5" opacity="0.9"/>
  <text x="160" y="160" text-anchor="middle" fill="#0ea5e9" font-family="monospace" font-size="13" font-weight="bold">E2E CLOUD</text>
  <rect x="80" y="175" width="50" height="30" rx="4" fill="#0ea5e9" opacity="0.3"/>
  <rect x="140" y="175" width="50" height="30" rx="4" fill="#0ea5e9" opacity="0.3"/>
  <rect x="80" y="210" width="110" height="20" rx="4" fill="#0ea5e9" opacity="0.2"/>
  <!-- Arrow -->
  <line x1="265" y1="180" x2="340" y2="180" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8,4"/>
  <polygon points="340,173 355,180 340,187" fill="#38bdf8"/>
  <!-- Migration tools -->
  <rect x="340" y="155" width="120" height="50" rx="8" fill="#0c2535" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
  <text x="400" y="185" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">MGN · DMS · SCT</text>
  <!-- Arrow 2 -->
  <line x1="465" y1="180" x2="540" y2="180" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8,4"/>
  <polygon points="540,173 555,180 540,187" fill="#38bdf8"/>
  <!-- Target AWS Cloud -->
  <rect x="540" y="100" width="210" height="160" rx="16" fill="#0c1f35" stroke="#22d3ee" stroke-width="1.5" opacity="0.9"/>
  <text x="645" y="135" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="bold">AWS + AZURE</text>
  <rect x="560" y="148" width="40" height="25" rx="4" fill="#22d3ee" opacity="0.25"/>
  <rect x="610" y="148" width="40" height="25" rx="4" fill="#22d3ee" opacity="0.25"/>
  <rect x="660" y="148" width="40" height="25" rx="4" fill="#22d3ee" opacity="0.25"/>
  <rect x="560" y="182" width="50" height="25" rx="4" fill="#22d3ee" opacity="0.2"/>
  <rect x="620" y="182" width="80" height="25" rx="4" fill="#22d3ee" opacity="0.2"/>
  <rect x="560" y="216" width="150" height="25" rx="4" fill="#22d3ee" opacity="0.15"/>
  <!-- K8s icon placeholder -->
  <circle cx="400" cy="330" r="35" fill="none" stroke="#326ce5" stroke-width="2" opacity="0.6"/>
  <text x="400" y="336" text-anchor="middle" fill="#326ce5" font-family="monospace" font-size="12">K8s</text>
  <text x="400" y="415" text-anchor="middle" fill="#0ea5e9" font-family="monospace" font-size="16" opacity="0.8">Multi-Cloud Migration · AWS &amp; Azure</text>
  <text x="400" y="438" text-anchor="middle" fill="#0369a1" font-family="monospace" font-size="11" opacity="0.6">MGN · DMS · SCT · Kubernetes · Zero Downtime</text>
</svg>
