<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#08050f"/>
  <defs>
    <radialGradient id="glow5" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#glow5)"/>
  <!-- Monolith (left, with cracks) -->
  <rect x="50" y="130" width="160" height="180" rx="8" fill="#1e0a3c" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
  <text x="130" y="160" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="12" font-weight="bold">MONOLITH</text>
  <rect x="70" y="175" width="120" height="15" rx="3" fill="#8b5cf6" opacity="0.3"/>
  <rect x="70" y="198" width="120" height="15" rx="3" fill="#8b5cf6" opacity="0.3"/>
  <rect x="70" y="221" width="120" height="15" rx="3" fill="#8b5cf6" opacity="0.3"/>
  <rect x="70" y="244" width="120" height="15" rx="3" fill="#8b5cf6" opacity="0.2"/>
  <rect x="70" y="267" width="120" height="15" rx="3" fill="#8b5cf6" opacity="0.2"/>
  <!-- Crack lines -->
  <path d="M130 175 L125 200 L135 220 L128 270" stroke="#c4b5fd" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Arrow -->
  <line x1="215" y1="220" x2="255" y2="220" stroke="#a78bfa" stroke-width="2.5"/>
  <polygon points="255,213 270,220 255,227" fill="#a78bfa"/>
  <text x="243" y="213" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="9">refactor</text>
  <!-- Microservices (right) -->
  <!-- Service boxes in a grid -->
  <rect x="290" y="90" width="90" height="65" rx="8" fill="#1e0a3c" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="335" y="118" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="bold">Auth</text>
  <text x="335" y="134" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="9">Service</text>

  <rect x="400" y="90" width="90" height="65" rx="8" fill="#1e0a3c" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="445" y="118" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="bold">API</text>
  <text x="445" y="134" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="9">Gateway</text>

  <rect x="510" y="90" width="90" height="65" rx="8" fill="#1e0a3c" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="555" y="118" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="bold">User</text>
  <text x="555" y="134" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="9">Service</text>

  <rect x="620" y="90" width="100" height="65" rx="8" fill="#1e0a3c" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="670" y="118" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="bold">Payment</text>
  <text x="670" y="134" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="9">Service</text>

  <rect x="290" y="185" width="90" height="65" rx="8" fill="#1e0a3c" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="335" y="213" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10" font-weight="bold">Notif</text>
  <text x="335" y="229" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="9">Service</text>

  <rect x="400" y="185" width="90" height="65" rx="8" fill="#1e0a3c" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="445" y="213" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10" font-weight="bold">DB</text>
  <text x="445" y="229" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="9">Service</text>

  <rect x="510" y="185" width="90" height="65" rx="8" fill="#1e0a3c" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="555" y="213" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10" font-weight="bold">Cache</text>
  <text x="555" y="229" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="9">Service</text>

  <rect x="620" y="185" width="100" height="65" rx="8" fill="#1e0a3c" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="670" y="213" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10" font-weight="bold">Analytics</text>
  <text x="670" y="229" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="9">Service</text>

  <!-- K8s wrapper -->
  <rect x="275" y="70" width="465" height="205" rx="14" fill="none" stroke="#326ce5" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <text x="303" y="90" fill="#326ce5" font-family="monospace" font-size="10" opacity="0.7">Kubernetes (EKS)</text>

  <!-- Service mesh lines -->
  <line x1="380" y1="122" x2="400" y2="122" stroke="#6d28d9" stroke-width="1" opacity="0.5"/>
  <line x1="490" y1="122" x2="510" y2="122" stroke="#6d28d9" stroke-width="1" opacity="0.5"/>
  <line x1="600" y1="122" x2="620" y2="122" stroke="#6d28d9" stroke-width="1" opacity="0.5"/>
  <line x1="380" y1="217" x2="400" y2="217" stroke="#6d28d9" stroke-width="1" opacity="0.5"/>
  <line x1="490" y1="217" x2="510" y2="217" stroke="#6d28d9" stroke-width="1" opacity="0.5"/>
  <line x1="600" y1="217" x2="620" y2="217" stroke="#6d28d9" stroke-width="1" opacity="0.5"/>

  <!-- Helm -->
  <rect x="380" y="305" width="100" height="40" rx="8" fill="#1e0a3c" stroke="#8b5cf6" stroke-width="1"/>
  <text x="430" y="330" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="11">Helm Charts</text>

  <text x="400" y="400" text-anchor="middle" fill="#8b5cf6" font-family="monospace" font-size="16" opacity="0.8">Monolith → Microservices Replatforming</text>
  <text x="400" y="425" text-anchor="middle" fill="#6d28d9" font-family="monospace" font-size="11" opacity="0.6">EKS · Docker · Terraform · Helm · Service Mesh</text>
</svg>
