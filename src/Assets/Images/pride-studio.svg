  <text x="400" y="405" text-anchor="middle" fill="#ec4899" font-family="monospace" font-size="15" opacity="0.9">PRIDE · AI-Powered Content Studio</text>
  <text x="400" y="432" text-anchor="middle" fill="#db2777" font-family="monospace" font-size="10" opacity="0.7">React · TypeScript · Tailwind CSS · Framer Motion · Context API · ARIA</text>
